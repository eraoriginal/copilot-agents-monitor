<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Agent Monitor</title>
		<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23e8743b'/%3E%3Crect x='4' y='5' width='2' height='2' fill='%23111'/%3E%3Crect x='10' y='5' width='2' height='2' fill='%23111'/%3E%3Crect x='4' y='10' width='8' height='1.5' fill='%23111'/%3E%3C/svg%3E" />
		<link rel="stylesheet" href="/styles.css" />
	</head>
	<body>
		<header class="topbar">
			<div class="brand">
				<span class="brand-mark" aria-hidden="true"></span>
				<span class="brand-name">agent<span class="accent">monitor</span></span>
			</div>
			<nav class="views" aria-label="View">
				<button type="button" data-view="live" aria-pressed="true">live</button>
				<button type="button" data-view="history" aria-pressed="false">history</button>
			</nav>
			<label class="session-picker live-only">
				<span class="muted">session</span>
				<select id="session-select" aria-label="Session"></select>
			</label>
			<label class="follow live-only">
				<input type="checkbox" id="follow" checked />
				<span>follow latest</span>
			</label>
			<div class="live" id="live" role="status" aria-live="polite"></div>
		</header>

		<main id="history" hidden>
			<div class="filters">
				<label>
					<span class="muted">workspace</span>
					<select id="history-workspace" aria-label="Workspace"></select>
				</label>
				<label>
					<span class="muted">period</span>
					<select id="history-period" aria-label="Period">
						<option value="7">last 7 days</option>
						<option value="30" selected>last 30 days</option>
						<option value="90">last 90 days</option>
						<option value="0">all</option>
					</select>
				</label>
			</div>
			<section class="kpis" id="history-kpis" aria-label="Totals over the period"></section>
			<div class="grid">
				<section class="panel" aria-labelledby="tickets-title">
					<div class="panel-head">
						<h2 id="tickets-title">Tickets</h2>
						<span class="muted">click a ticket to list its sessions</span>
					</div>
					<div class="table-wrap" id="history-tickets"></div>
				</section>
				<aside class="side">
					<section class="panel" aria-labelledby="ticket-cost-title">
						<div class="panel-head"><h2 id="ticket-cost-title">Cost by ticket</h2></div>
						<div id="history-ticket-bars"></div>
					</section>
					<section class="panel" aria-labelledby="agent-share-title">
						<div class="panel-head"><h2 id="agent-share-title">Cost by agent</h2></div>
						<div id="history-agent-bars"></div>
					</section>
				</aside>
			</div>
			<section class="panel" aria-labelledby="sessions-title">
				<div class="panel-head">
					<h2 id="sessions-title">Sessions</h2>
					<span class="muted" id="history-sessions-meta"></span>
				</div>
				<div class="table-wrap" id="history-sessions"></div>
			</section>
		</main>

		<main id="app">
			<section class="kpis" id="kpis" aria-label="Session totals"></section>

			<div class="grid">
				<section class="panel flow-panel" aria-labelledby="flow-title">
					<div class="panel-head">
						<h2 id="flow-title">Orchestration</h2>
						<span class="muted" id="flow-meta"></span>
					</div>
					<div id="flow"></div>
				</section>

				<aside class="side">
					<section class="panel tools-panel" id="tools-panel" aria-labelledby="tools-title" hidden>
						<div class="panel-head">
							<h2 id="tools-title">Tool calls</h2>
							<span class="tools-head-end">
								<span class="muted" id="tools-meta"></span>
								<button type="button" class="tools-close" id="tools-close" aria-label="Close the tool calls" title="Close (Esc)">✕</button>
							</span>
						</div>
						<div class="tools-agent" id="tools-agent"></div>
						<div class="tools-mcp" id="tools-mcp" hidden></div>
						<div class="tools-tally" id="tools-tally"></div>
						<div class="tools-list" id="tools-list" tabindex="0"></div>
						<div class="empty-note" id="tools-note"></div>
					</section>
					<section class="panel tools-panel" id="message-panel" aria-labelledby="message-title" hidden>
						<div class="panel-head">
							<h2 id="message-title">Message</h2>
							<span class="tools-head-end">
								<span class="muted" id="message-meta"></span>
								<button type="button" class="tools-close" id="message-close" aria-label="Close the message" title="Close (Esc)">✕</button>
							</span>
						</div>
						<div class="views message-tabs" role="group" aria-label="Direction">
							<button type="button" data-direction="launch" aria-pressed="true">sent</button>
							<button type="button" data-direction="ret" aria-pressed="false">sent back</button>
						</div>
						<div class="message-route" id="message-route"></div>
						<div class="message-body" id="message-body"></div>
					</section>
					<section class="panel" aria-labelledby="indicators-title">
						<div class="panel-head">
							<h2 id="indicators-title">Indicators</h2>
							<span class="muted">against their target</span>
						</div>
						<div id="indicators"></div>
					</section>
					<section class="panel" aria-labelledby="progress-title">
						<div class="panel-head"><h2 id="progress-title">Progress</h2></div>
						<div id="progress"></div>
					</section>
					<section class="panel" aria-labelledby="routing-title">
						<div class="panel-head">
							<h2 id="routing-title">Routing</h2>
							<span class="muted" id="routing-meta"></span>
						</div>
						<div id="routing"></div>
					</section>
					<section class="panel" aria-labelledby="cost-title">
						<div class="panel-head">
							<h2 id="cost-title">Cost by agent</h2>
							<span class="muted" id="cost-note"></span>
						</div>
						<div id="cost-agents"></div>
					</section>
					<section class="panel" aria-labelledby="model-title">
						<div class="panel-head"><h2 id="model-title">By model</h2></div>
						<div id="cost-models"></div>
					</section>
					<section class="panel" aria-labelledby="mcp-title">
						<div class="panel-head">
							<h2 id="mcp-title">MCP servers</h2>
							<span class="muted" id="mcp-meta"></span>
						</div>
						<div id="mcp"></div>
					</section>
				</aside>
			</div>

			<section class="panel" aria-labelledby="timeline-title">
				<div class="panel-head">
					<h2 id="timeline-title">Timeline</h2>
					<div class="legend" aria-label="Legend">
						<span><i class="swatch llm"></i>LLM call</span>
						<span><i class="swatch tool"></i>tool call</span>
						<span><i class="swatch mcp"></i>MCP call</span>
						<span><i class="swatch agent"></i>agent running</span>
					</div>
				</div>
				<div id="timeline"></div>
			</section>

			<section class="panel" aria-labelledby="log-title">
				<div class="panel-head">
					<h2 id="log-title">Session log</h2>
					<span class="muted" id="log-meta"></span>
				</div>
				<div class="log" id="log" tabindex="0"></div>
			</section>
		</main>

		<footer class="statusline" id="statusline"></footer>
		<div class="tooltip" id="tooltip" role="tooltip" hidden></div>

		<script type="module" src="/app.js"></script>
	</body>
</html>
